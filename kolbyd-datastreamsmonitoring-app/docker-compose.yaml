name: liveflow-plugin-review

services:
  flow-service:
    build:
      context: ../live-flow
      dockerfile: ../kolbyd-datastreamsmonitoring-app/Dockerfile.flow-service
    ports:
      - '127.0.0.1:4318:4318'
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:4318
      DOTNET_EnableDiagnostics: '0'
    secrets:
      - flow_service_api_key
    entrypoint:
      - /bin/sh
      - -ec
      - 'export Flow__ApiKey="$$(cat /run/secrets/flow_service_api_key)"; exec dotnet LiveFlow.dll --urls http://0.0.0.0:4318'
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:4318/healthz']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']

  grafana:
    image: grafana/grafana:13.2.4
    ports:
      - '127.0.0.1:3001:3000'
    environment:
      GF_DEFAULT_APP_MODE: development
      GF_SERVER_ROOT_URL: http://127.0.0.1:3001/
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: 'true'
      GF_USERS_DEFAULT_THEME: dark
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_LOG_LEVEL: info
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: eageraspen2909-datastreamsmonitoring-app,eageraspen2909-datastreamsmonitoring-datasource
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      FLOW_SERVICE_URL: http://flow-service:4318
    secrets:
      - grafana_admin_password
      - flow_service_api_key
    entrypoint:
      - /bin/sh
      - -ec
      - 'export FLOW_SERVICE_API_KEY="$$(cat /run/secrets/flow_service_api_key)"; exec /run.sh'
    volumes:
      - ./dist:/var/lib/grafana/plugins/eageraspen2909-datastreamsmonitoring-app:ro
      - ./provisioning:/etc/grafana/provisioning:ro
    depends_on:
      flow-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    mem_limit: 1g
    cpus: 2.0
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']

secrets:
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD
  flow_service_api_key:
    environment: FLOW_SERVICE_API_KEY
